[project]
name = "featherstorm"
version = "0.1.0"
description = "A League of Legends companion terminal app."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chroma",
    "govee",
    "httpx[http2]>=0.28.1",
    "pillow>=12.2.0",
    "pydantic>=2.12.5",
    "pynput>=1.8.2",
    "pypresence>=4.6.1",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
    "surrealdb>=2.0.0",
    "toml>=0.10.2",
    "typer>=0.24.1",
    "websockets>=16.0",
]

[project.scripts]
featherstorm = "league.cli:app"

[project.gui-scripts]
bladecaller = "league.bladecaller:launch_ui"

[project.optional-dependencies]
ui = [
    "pyside6>=6.11.1",
    "qasync>=0.28.0",
]

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "league"

[tool.uv.sources]
chroma = { path = "../rzr-chroma", editable = true }
govee = { path = "../govee", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.4",
]

[tool.ruff]
exclude = [
    "__init__.py",
    ".venv/*",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    ".claude",
    "build",
    "dist",
    "site-packages",
    "venv",
    "pyproject.toml",
]
line-length = 160
indent-width = 4

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "cr-lf"
